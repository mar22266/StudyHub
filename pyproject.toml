[project]
name = "studyhub"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "pydantic[email]==2.10.3",
  "PyJWT==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.fastapi.static]
# Los archivos de React son públicos; no necesitan el middleware CORS de la API.
cdn = true
