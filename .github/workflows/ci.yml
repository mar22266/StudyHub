name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Jest, TypeScript y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.CI_NODE_VERSION || '22' }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=low
      - name: Auditoría completa y registro de la excepción de desarrollo
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --audit-level=moderate
      - name: Guardar auditoría npm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-npm
          path: frontend/npm-audit.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-jest
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Python y API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.CI_PYTHON_VERSION || '3.12' }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - name: Auditoría de dependencias Python
        run: python -m pip_audit --local --format json --output pip-audit.json
      - name: Guardar auditoría Python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-python
          path: pip-audit.json
          retention-days: 14
      - name: Verificar dependencias iguales en Docker y Vercel
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          docker = Path('backend/requirements.txt').read_text().splitlines()
          vercel = tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']
          if sorted(docker) != sorted(vercel):
              raise SystemExit('Las dependencias de Docker y Vercel deben coincidir.')
          PY
      - run: python -m compileall -q backend/app
      - name: Pruebas del despliegue
        run: python -m unittest discover -s scripts/tests -v
      - name: Pruebas de autenticación y carga segura de datos
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Construir y desplegar el entorno temporal
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/deploy-local.py
          --env-file "$RUNNER_TEMP/studyhub-ci.env"
          --project-name studyhub-ci
          --port 18080
          --evidence-dir "$RUNNER_TEMP/studyhub-evidence"
      - name: Guardar evidencia del despliegue temporal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: despliegue-temporal
          path: ${{ runner.temp }}/studyhub-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Limpiar únicamente el entorno temporal de CI
        if: always()
        run: >-
          docker compose --project-name studyhub-ci
          --env-file "$RUNNER_TEMP/studyhub-ci.env"
          -f compose.deploy.yml down --volumes

  secrets:
    name: Secretos en el código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
